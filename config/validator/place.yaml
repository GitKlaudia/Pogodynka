App\Entity\Place:
    properties:
        Locality:
            - NotBlank:
                  groups: [create,edit]
        Country:
            - NotBlank:
                  groups: [create,edit]
        Latitude:
            - Range:
                  min: -90
                  max: 90
                  groups: [create, edit]
        Longitude:
            - Range:
                  min: -180
                  max: 180
                  groups: [create, edit]


